<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Us | Your Bakery Name</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://images.unsplash.com/photo-1608219959302-3d8a2d03a091?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .section {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 12px;
      max-width: 800px;
      margin: 40px auto;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      text-align: center;
    }

    p, label {
      font-size: 18px;
      line-height: 1.6;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    input, textarea {
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      resize: vertical;
    }

    button {
      padding: 12px;
      background-color: #ffb347;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #ffa726;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      p, label {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

 

  <!-- Contact Us Section -->
  <div class="section">
    <h1>Contact Us</h1>
    <p>If you have questions, want to place a custom order, or just want to say hello — we’d love to hear from you!</p>
    
    <form class="contact-form" action="#" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>

</body>
</html>
